[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truevoice"
version = "0.1.0"
description = "AI-powered voice integrity and deepfake audio detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "torch>=2.1",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]
