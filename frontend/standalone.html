                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                  
                  {/* Left (Col 1-4): Risk Speedometer */}
                  <div className="lg:col-span-4 bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-center border-b border-[#EAEAE5] pb-3 mb-4">
                        <span className="text-xs font-mono uppercase text-[#52525B] font-semibold">Forensic Risk Engine</span>
                        <span className={`text-xs font-mono px-2.5 py-1 rounded-full border shadow-soft-sm font-semibold ${scenario.overallRiskScore > 70 ? 'bg-[#FFF1F2] text-[#BE123C] border-[#FECDD3]' : scenario.overallRiskScore > 40 ? 'bg-[#FFFBEB] text-[#B45309] border-[#FDE68A]' : 'bg-[#ECFDF5] text-[#047857] border-[#A7F3D0]'}`}>
                          {scenario.riskTier}
                        </span>
                      </div>

                      {/* SVG Gauge */}
                      <div className="flex flex-col items-center justify-center my-3">
                        <svg className="w-56 h-32 overflow-visible" viewBox="0 0 220 125">
                          <path d="M 25,110 A 85,85 0 0,1 195,110" fill="none" stroke="#EAEAE5" strokeWidth="14" strokeLinecap="round" />
                          <path d="M 25,110 A 85,85 0 0,1 195,110" fill="none" stroke={getThemeColor(scenario.overallRiskScore)} strokeWidth="14" strokeDasharray="267" strokeDashoffset={267 - (scenario.overallRiskScore / 100) * 267} strokeLinecap="round" className="transition-all duration-700" />
                          <g transform={`rotate(${needleAngle}, 110, 110)`} className="transition-transform duration-700 origin-[110px_110px]">
                            <polygon points="107,110 113,110 111,35 109,35" fill={getThemeColor(scenario.overallRiskScore)} />
                            <circle cx="110" cy="110" r="7" fill="#FFFFFF" stroke={getThemeColor(scenario.overallRiskScore)} strokeWidth="3" />
                          </g>
                        </svg>
                        <div className="text-4xl font-mono font-extrabold mt-1 text-[#18181B]">
                          {scenario.overallRiskScore.toFixed(1)}%
                        </div>
                        <div className="text-[10px] font-mono text-[#71717A] uppercase tracking-widest">Composite Impersonation Index</div>
                      </div>

                      <div className="p-3 rounded-xl bg-[#F9F9F7] border border-[#EAEAE5] text-xs font-mono text-[#27272A] mb-4">
                        <span className="text-[#EA580C] font-bold">VERDICT: </span>
                        {scenario.threatVerdict}
                      </div>
                    </div>

                    {/* Factors */}
                    <div className="space-y-2 border-t border-[#EAEAE5] pt-3">
                      {scenario.factors.map(f => (
                        <div key={f.id} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="text-[#27272A] font-medium">{f.name}</span>
                            <span className="font-mono text-[11px] text-[#71717A]">{(f.weight * 100).toFixed(0)}% wgt · <strong className={f.rawScore > 70 ? 'text-[#BE123C]' : 'text-[#047857]'}>{f.rawScore.toFixed(0)}/100</strong></span>
                          </div>
                          <div className="w-full bg-[#F4F4F0] rounded-full h-1.5 overflow-hidden border border-[#EAEAE5]/60">
                            <div className={`h-full ${f.rawScore > 70 ? 'bg-[#BE123C]' : f.rawScore > 40 ? 'bg-[#EA580C]' : 'bg-[#047857]'} rounded-full`} style={{ width: `${f.rawScore}%` }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Center (Col 5-8): Waveform & Transcript */}
                  <div className="lg:col-span-5 flex flex-col gap-6">
                    
                    {/* Audio Player */}
                    <div className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft">
                      <div className="flex justify-between items-center border-b border-[#EAEAE5] pb-3 mb-4 text-xs font-mono text-[#18181B]">
                        <span className="truncate max-w-xs font-semibold">{scenario.filename}</span>
                        <span className="bg-[#F4F4F0] text-[#52525B] px-2 py-0.5 rounded text-[10px] border border-[#E4E4DF]">{scenario.sampleRate}</span>
                      </div>

                      {/* Scrubbable Waveform */}
                      <div
                        onClick={(e) => {
                          const rect = e.currentTarget.getBoundingClientRect();
                          const pos = (e.clientX - rect.left) / rect.width;
                          setCurrentTime(pos * scenario.audioDuration);
                        }}
                        className="relative h-24 bg-[#F9F9F7] border border-[#EAEAE5] rounded-xl p-2 cursor-pointer flex items-center justify-between gap-1 overflow-hidden"
                      >
                        {Array.from({ length: 50 }, (_, i) => {
                          const isSynth = scenario.overallRiskScore > 70 && ((i > 8 && i < 20) || (i > 32 && i < 44));
                          const played = (i / 50) * scenario.audioDuration <= currentTime;
                          return (
                            <div key={i} className="flex-1 flex items-center justify-center h-full">
                              <div
                                className="w-full max-w-[4px] rounded-full transition-all"
                                style={{
                                  height: `${(Math.sin(i * 0.5) * 0.4 + 0.5) * (isSynth ? 90 : 60) + 15}%`,
                                  backgroundColor: isSynth ? '#F43F5E' : (played ? '#F97316' : '#D4D4D0')
                                }}
                              />
                            </div>
                          );
                        })}
                        {/* Playhead */}
                        <div
                          className="absolute top-0 bottom-0 w-[2px] bg-[#EA580C]"
                          style={{ left: `${(currentTime / scenario.audioDuration) * 100}%` }}
                        />
                      </div>

                      {/* Controls */}
                      <div className="flex justify-between items-center mt-4">
                        <button
                          onClick={() => setIsPlaying(!isPlaying)}
                          className="px-4 py-2 rounded-xl bg-[#EA580C] hover:bg-[#C2410C] text-white font-mono text-xs font-semibold transition-all shadow-soft"
                        >
                          {isPlaying ? 'PAUSE' : 'PLAY FORENSICS'}
                        </button>
                        <div className="font-mono text-sm text-[#18181B] font-bold">
                          <span className="text-[#EA580C]">{currentTime.toFixed(1)}s</span> / {scenario.audioDuration.toFixed(1)}s
                        </div>
                      </div>
                    </div>

                    {/* Transcript Panel */}
                    <div className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft flex-1">
                      <div className="flex justify-between items-center border-b border-[#EAEAE5] pb-3 mb-3 text-xs font-mono text-[#71717A]">
                        <span>Speech-To-Text (ASR) • Time Synced</span>
                        <span className="text-[10px] text-[#C2410C] bg-[#FFF7ED] px-2 py-0.5 rounded-full font-semibold border border-[#FED7AA]">CLICK TO SEEK</span>
                      </div>
                      <div className="space-y-2.5 max-h-[300px] overflow-y-auto pr-1 custom-scrollbar">
                        {scenario.transcript.map(t => (
                          <div
                            key={t.id}
                            onClick={() => setCurrentTime(t.timeOffset)}
                            className={`p-2.5 rounded-xl border text-xs cursor-pointer transition-all shadow-soft-sm ${
                              Math.abs(currentTime - t.timeOffset) < 3
                                ? 'bg-white border-[#EA580C] ring-2 ring-[#EA580C]/20'
                                : t.threat
                                ? 'bg-[#FFF7ED] border-[#FED7AA]'
                                : 'bg-[#F9F9F7] border-[#E4E4DF]'
                            }`}
                          >
                            <div className="flex justify-between text-[11px] font-mono text-[#71717A] mb-1">
                              <span className={t.speaker.includes('Caller') ? 'text-[#BE123C] font-semibold' : 'text-[#0284C7] font-semibold'}>{t.speaker}</span>
                              <span>+{t.timeOffset}s</span>
                            </div>
                            <p className="text-[#27272A]">{t.text}</p>
                            {t.threat && (
                              <span className="inline-block mt-1 text-[10px] font-mono font-bold uppercase bg-[#FFEDD5] text-[#9A3412] px-1.5 py-0.5 rounded border border-[#FED7AA]">
                                {t.threat}
                              </span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>

                  {/* Right (Col 9-12): Biometrics & Locks */}
                  <div className="lg:col-span-3 space-y-4">
                    {/* Biometric Card */}
                    <div className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft">
                      <div className="flex justify-between items-center border-b border-[#EAEAE5] pb-3 mb-3">
                        <span className="text-xs font-mono uppercase text-[#52525B] font-semibold">ECAPA-TDNN Match</span>
                        <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-bold uppercase shadow-soft-sm ${scenario.biometric.similarityScore < scenario.biometric.matchThreshold ? 'bg-[#FFF1F2] text-[#BE123C] border border-[#FECDD3]' : 'bg-[#ECFDF5] text-[#047857] border border-[#A7F3D0]'}`}>
                          {scenario.biometric.similarityScore < scenario.biometric.matchThreshold ? 'MISMATCH' : 'VERIFIED'}
                        </span>
                      </div>
                      <div className="flex items-center gap-3 mb-3">
                        <img src={scenario.biometric.avatarUrl} alt="" className="w-12 h-12 rounded-xl object-cover border border-[#EAEAE5] shadow-soft-sm" />
                        <div>
                          <h4 className="text-sm font-semibold text-[#18181B]">{scenario.biometric.fullName}</h4>
                          <p className="text-xs text-[#71717A]">{scenario.biometric.title}</p>
                        </div>
                      </div>
                      <div className="bg-[#F9F9F7] p-3 rounded-xl border border-[#EAEAE5] text-xs font-mono space-y-1">
                        <div className="flex justify-between">
                          <span className="text-[#71717A]">Cosine Similarity:</span>
                          <span className={`font-bold ${scenario.biometric.similarityScore < scenario.biometric.matchThreshold ? 'text-[#BE123C]' : 'text-[#047857]'}`}>
                            {scenario.biometric.similarityScore} / {scenario.biometric.matchThreshold} req
                          </span>
                        </div>
                        <div className="w-full bg-[#EAEAE5] rounded-full h-1.5 overflow-hidden">
                          <div className={`h-full ${scenario.biometric.similarityScore < scenario.biometric.matchThreshold ? 'bg-[#BE123C]' : 'bg-[#047857]'}`} style={{ width: `${scenario.biometric.similarityScore * 100}%` }} />
                        </div>
                      </div>
                    </div>

                    {/* Locks */}
                    <div className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft">
                      <div className="flex justify-between items-center border-b border-[#EAEAE5] pb-3 mb-3">
                        <span className="text-xs font-mono uppercase text-[#52525B] font-semibold">Zero-Trust Guard</span>
                        <span className="text-xs font-mono text-[#BE123C] font-bold">{scenario.lockedActions.length} Locked</span>
                      </div>
                      {scenario.lockedActions.length === 0 ? (
                        <div className="text-xs font-mono text-[#047857] text-center py-4 bg-[#ECFDF5] border border-[#A7F3D0] rounded-xl">No high-risk actions intercepted.</div>
                      ) : (
                        <div className="space-y-2">
                          {scenario.lockedActions.map(a => (
                            <div key={a.id} className="p-3 rounded-xl bg-[#FFF1F2] border border-[#FECDD3] text-xs shadow-soft-sm">
                              <div className="font-semibold text-[#18181B]">{a.name}</div>
                              <div className="text-[11px] font-mono text-[#71717A] truncate">{a.target}</div>
                            </div>
                          ))}
                        </div>
                      )}
                      <button
                        onClick={triggerChallenge}
                        className={`w-full mt-4 py-2.5 px-4 rounded-xl font-mono text-xs font-semibold transition-all shadow-soft ${
                          challengeSent ? 'bg-[#047857] text-white' : 'bg-[#EA580C] hover:bg-[#C2410C] text-white font-bold'
                        }`}
                      >
                        {challengeSent ? 'CHALLENGE BROADCASTED (FIDO2)...' : 'ISSUE STEP-UP HARDWARE PUSH'}
                      </button>
                    </div>

                  </div>

                </div>
              </div>
            )}

            {/* VIEW 2: INCIDENT SESSIONS */}
            {tab === 'sessions' && (
              <div className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft space-y-4">
                <h2 className="text-base font-bold text-[#18181B]">Incident Telemetry Sessions</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono">
                    <thead className="bg-[#F8F8F6] text-[#71717A] border-b border-[#EAEAE5] uppercase">
                      <tr>
                        <th className="p-3">Call ID</th>
                        <th className="p-3">Timestamp</th>
                        <th className="p-3">Target Executive</th>
                        <th className="p-3">Primary Threat Vector</th>
                        <th className="p-3">Risk Score</th>
                        <th className="p-3">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#EAEAE5]">
                      {mockIncidentSessions.map(s => (
                        <tr key={s.id} className="hover:bg-[#F9F9F7]">
                          <td className="p-3 font-bold text-[#EA580C]">{s.callId}</td>
                          <td className="p-3 text-[#71717A]">{s.timestamp}</td>
                          <td className="p-3 text-[#18181B] font-sans font-medium">{s.identity}</td>
                          <td className="p-3 text-[#BE123C] font-sans">{s.threat}</td>
                          <td className="p-3 font-bold text-[#18181B]">{s.riskScore}% ({s.tier})</td>
                          <td className="p-3">
                            <button onClick={() => { selectScenario(s.tier === 'CRITICAL' ? 'attack' : s.tier === 'LOW' ? 'authentic' : 'borderline'); setTab('console'); }} className="text-[#EA580C] font-semibold hover:underline">
                              Inspect Console →
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW 3: BIOMETRICS VAULT */}
            {tab === 'speakers' && (
              <div className="space-y-4">
                <h2 className="text-base font-bold text-[#18181B]">Enrolled Executive Biometrics Enclave</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {[scenarioAuthentic.biometric, scenarioAttack.biometric, scenarioBorderline.biometric].map(b => (
                    <div key={b.enrolledId} className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft">
                      <div className="flex items-center gap-3 mb-3">
                        <img src={b.avatarUrl} alt="" className="w-12 h-12 rounded-xl object-cover border border-[#EAEAE5] shadow-soft-sm" />
                        <div>
                          <div className="font-semibold text-[#18181B]">{b.fullName}</div>
                          <div className="text-xs text-[#71717A]">{b.title}</div>
                        </div>
                      </div>
                      <div className="text-xs font-mono text-[#52525B] space-y-1">
                        <div>Dept: <span className="text-[#EA580C] font-semibold">{b.department}</span></div>
                        <div>Samples: {b.centroidSamples} clean recordings</div>
                        <div>Centroid: {b.ecapaEmbeddingHash}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 4: AUDIT LEDGER */}
            {tab === 'audit' && (
              <div className="bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft space-y-4">
                <h2 className="text-base font-bold text-[#18181B]">Cryptographic SHA-256 Audit Trail</h2>
                <div className="space-y-3">
                  {auditList.map(b => (
                    <div key={b.num} className="p-4 rounded-xl bg-[#F9F9F7] border border-[#EAEAE5] text-xs font-mono shadow-soft-sm">
                      <div className="flex justify-between text-[#71717A] mb-1">
                        <span className="text-[#EA580C] font-bold">Block #{b.num} • {b.type}</span>
                        <span>{b.time}</span>
                      </div>
                      <p className="text-[#27272A] font-sans my-1">{b.details}</p>
                      <div className="text-[11px] text-[#A1A1AA] truncate">Hash: {b.hash}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 5: POLICY TUNING */}
            {tab === 'policies' && (
              <div className="max-w-3xl mx-auto bg-white border border-[#EAEAE5] rounded-2xl p-6 shadow-soft space-y-6">
                <h2 className="text-base font-bold text-[#18181B]">Threat Threshold & Policy Tuning</h2>
                <div className="space-y-4 text-xs font-mono">
                  <div>
                    <div className="flex justify-between mb-1">
                      <span className="text-[#B45309] font-semibold">Caution Threshold:</span>
                      <span className="text-[#18181B] font-bold">{cautionThresh}%</span>
                    </div>
                    <input type="range" min="10" max="50" value={cautionThresh} onChange={e => setCautionThresh(Number(e.target.value))} className="w-full accent-[#F59E0B]" />
                  </div>
                  <div>
                    <div className="flex justify-between mb-1">
                      <span className="text-[#EA580C] font-semibold">Step-Up Verify Threshold:</span>
                      <span className="text-[#18181B] font-bold">{verifyThresh}%</span>
                    </div>
                    <input type="range" min="40" max="80" value={verifyThresh} onChange={e => setVerifyThresh(Number(e.target.value))} className="w-full accent-[#EA580C]" />
                  </div>
                  <div>
                    <div className="flex justify-between mb-1">
                      <span className="text-[#BE123C] font-semibold">Block / Lockdown Threshold:</span>
                      <span className="text-[#18181B] font-bold">{blockThresh}%</span>
                    </div>
                    <input type="range" min="70" max="95" value={blockThresh} onChange={e => setBlockThresh(Number(e.target.value))} className="w-full accent-[#BE123C]" />
                  </div>
                  <div>
                    <div className="flex justify-between mb-1">
                      <span className="text-[#EA580C] font-semibold">ECAPA Cosine Strictness:</span>
                      <span className="text-[#18181B] font-bold">{ecapaThresh}</span>
                    </div>
                    <input type="range" min="0.6" max="0.9" step="0.01" value={ecapaThresh} onChange={e => setEcapaThresh(Number(e.target.value))} className="w-full accent-[#EA580C]" />
                  </div>
                </div>
                <button onClick={() => alert('Policy saved & synced to cluster.')} className="w-full py-2.5 rounded-xl bg-[#EA580C] hover:bg-[#C2410C] text-white font-mono text-xs font-semibold transition-all shadow-soft">
                  COMMIT POLICY CHANGES
                </button>
              </div>
            )}

          </main>

          {/* Auth Modal */}
          {authOpen && (
            <div className="fixed inset-0 z-50 bg-[#18181B]/30 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-white border border-[#EAEAE5] rounded-2xl p-5 shadow-soft-lg space-y-4">
                <div className="flex justify-between items-center border-b border-[#EAEAE5] pb-3">
                  <h3 className="text-sm font-bold font-mono text-[#18181B]">Switch Operator Persona</h3>
                  <button onClick={() => setAuthOpen(false)} className="text-[#71717A] hover:text-[#18181B]">✕</button>
                </div>
                <div className="space-y-2">
                  {personas.map(p => (
                    <div
                      key={p.id}
                      onClick={() => { setPersona(p); setAuthOpen(false); }}
                      className={`p-3 rounded-xl border cursor-pointer flex items-center justify-between text-xs transition-all shadow-soft-sm ${
                        persona.id === p.id ? 'bg-[#FFF7ED] border-[#EA580C] ring-2 ring-[#EA580C]/20' : 'bg-white border-[#EAEAE5] hover:border-[#D4D4D0]'
                      }`}
                    >
                      <div>
                        <div className="font-semibold text-[#18181B]">{p.name}</div>
                        <div className="text-[11px] text-[#71717A] font-mono">{p.role}</div>
                      </div>
                      <span className="text-[10px] font-mono text-[#52525B] bg-[#F4F4F0] px-2 py-0.5 rounded border border-[#E4E4DF]">{p.badge}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-[#EAEAE5] bg-white/80 py-3 px-6 text-center text-[11px] font-mono text-[#71717A] shadow-soft-sm">
            TrueVoice Threat Response Console • Zero-Trust Forensic Enclave • US-East-1A
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
